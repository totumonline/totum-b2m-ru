map $host $b2m_hsts {
    default "max-age=31536000";
}

server {
    listen *:443 ssl;
    server_name _;
    charset UTF-8;
    root /home/totum/totum-pro/http/;
    index index.php;
    http2 on;
    expires off;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/YOUR_DOMAIN/chain.pem;

    client_max_body_size 100M;

    add_header Strict-Transport-Security $b2m_hsts always;

    location / {
    try_files $uri $uri/ /index.php?$args;
    }

    location ~ ^/fls/6_main_img.png$ {
    try_files /fls/$host/6_main_img.png $uri /fls/hand.png;
    }

    location ~ ^/fls/6_favicon.png$ {
    try_files /fls/$host/6_favicon.png $uri /fls/hand_favicon.png;
    }

    location = /robots.txt {
    try_files /seo/$host/robots.txt =404;
    }

    location = /sitemap.xml {
    try_files /seo/$host/sitemap.xml =404;
    }

    location ~ ^/fls/(.+)$ {
    try_files /fls/$host/$1 $uri /fls/no-img.jpg;
    add_header Strict-Transport-Security $b2m_hsts always;
    add_header Cache-Control "public, max-age=2592000, no-transform";
    access_log off;
    }

    location ~ ^/fonts/(.+)$ {
    add_header Strict-Transport-Security $b2m_hsts always;
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Credentials' 'true';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
    expires 365d;
    }

    # --- BROTLI CONFIG START ---

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_static on;
    brotli_types
        text/css
        application/javascript
        application/json;

    # --- BROTLI CONFIG END ---

    # --- GZIP CONFIG START ---

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/json;

    # --- GZIP CONFIG END ---

    # --- EXPIRES START ---

    location ~* \.(css|js)$ {
        add_header Strict-Transport-Security $b2m_hsts always;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
    }

    location ~* \.(ttf|woff2)$ {
        add_header Strict-Transport-Security $b2m_hsts always;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        add_header 'Access-Control-Allow-Origin' '*';
        access_log off;
    }

    # --- EXPIRES END ---

    # added functionality for web sockets
    location /PRONotify {
    proxy_pass http://localhost:8181/PRONotify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    }
    # ...

    location ~* \.php$ {

    fastcgi_pass unix:/run/php/php8.5-fpm-totum.sock;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    fastcgi_read_timeout 300;

    fastcgi_hide_header Cache-Control;
    fastcgi_hide_header Pragma;
    fastcgi_hide_header Expires;
    add_header Strict-Transport-Security $b2m_hsts always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Cache-Control "private, no-cache";
    }
}

server {
    include acme;

    listen *:80;
    server_name _;

    location / {
    return 301 https://$host$request_uri;
    }
}
