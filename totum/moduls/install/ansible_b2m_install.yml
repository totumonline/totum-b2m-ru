---

- hosts: localhost
  become: true

  tasks:

  # Ubuntu version, local and timezone

  - name: Ensure locales package is installed
    apt:
      name: locales
      state: present

  - name: Check if LANG=en_US.UTF-8 is set
    shell: locale | grep -c 'LANG=en_US.UTF-8'
    register: locale_check

  - name: Fail if LANG=en_US.UTF-8 is not set
    fail:
      msg: "LANG=en_US.UTF-8 is not set in the locale configuration"
    when: locale_check.stdout | int == 0

  - name: Set the timezone
    command: timedatectl set-timezone {{ lookup('env', 'TOTUMTIMEZONE') }}

  # Add PPA and some packages

  - name: apt install some common packages
    apt:
      name:
        - git
        - unzip
        - curl
        - nano
        - htop
        - wget
        - certbot
        - ufw
        - gnupg
        - tzdata
        - openssl
        - imagemagick
        - brotli
      state: latest

  # Add PHP (sury)

  - name: Download sury PHP GPG key
    get_url:
      url: https://mirror.yandex.ru/mirrors/packages.sury.org/php/apt.gpg
      dest: /usr/share/keyrings/deb.sury.org-php.gpg
      owner: root
      group: root
      mode: '0644'

  - name: Add sury PHP repository to sources
    copy:
      dest: /etc/apt/sources.list.d/php.sources
      owner: root
      group: root
      mode: '0644'
      content: |
        Types: deb
        URIs: https://mirror.yandex.ru/mirrors/packages.sury.org/php/
        Suites: resolute
        Components: main
        Signed-By: /usr/share/keyrings/deb.sury.org-php.gpg

  # Add PostgreSQL

  - name: Check if postgresql gpg key exists
    stat:
      path: /usr/share/keyrings/postgresql-archive-keyring.gpg
    register: postgresql_gpg

  - name: Download PostgreSQL GPG key and convert to .gpg format
    command: >
      bash -c "curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
      gpg --dearmor -o /usr/share/keyrings/postgresql-archive-keyring.gpg"
    when: not postgresql_gpg.stat.exists

  - name: Add PostgreSQL repository to sources list
    lineinfile:
      path: /etc/apt/sources.list.d/pgdg.list
      line: "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg] http://apt.postgresql.org/pub/repos/apt resolute-pgdg main"
      create: yes
      owner: root
      group: root
      mode: '0644'

  - name: Apt update
    apt:
      update_cache: yes

  - name: Deny all incoming connections by default
    ufw:
      default: deny
      direction: incoming

  - name: Allow all outgoing connections by default
    ufw:
      default: allow
      direction: outgoing

  - name: Allow HTTP traffic on port 22
    ufw:
      rule: allow
      port: 22
      proto: tcp

  - name: Allow HTTP traffic on port 80
    ufw:
      rule: allow
      port: 80
      proto: tcp

  - name: Allow HTTPS traffic on port 443
    ufw:
      rule: allow
      port: 443
      proto: tcp

  - name: Ensure UFW is enabled
    ufw:
      state: enabled

  # Get a certificate

  - name: Check CERTBOTDOMAIN environment variable
    set_fact:
      check_domain: "{{ lookup('env', 'CERTBOTDOMAIN') }}"

  - name: Fail if CERTBOTDOMAIN is empty
    fail:
      msg: "CERTBOTDOMAIN is not set. Installation is possible only with a domain."
    when: check_domain == ""

  - name: Check for certbot certificate directory
    stat:
      path: /etc/letsencrypt/live/{{ lookup('env', 'CERTBOTDOMAIN') }}
    register: certbot_certificate_directory

  - name: Certificate exist
    debug:
      msg: "Certificate exist!"
    when: certbot_certificate_directory.stat is defined and certbot_certificate_directory.stat.exists

  - name: Run certbot dry run for check domain
    shell: "certbot certonly --standalone --dry-run --non-interactive --register-unsafely-without-email --agree-tos -d {{ lookup('env', 'CERTBOTDOMAIN') }}"
    register: certbot_check_domain_result
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Debug certbot check domain result
    debug:
      msg: "{{ certbot_check_domain_result.stdout }}"
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Check for success message in certbot output
    assert:
      that:
        - "'The dry run was successful.' in certbot_check_domain_result.stdout"
      fail_msg: "Certbot did't get certificate for you domain! Check DNS for you domain and try again later! If you setup NS or DNS less than 3 hours ago, maybe these changes have not reached the Let's encrypt servers. Wait one hour and try again."
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Check for Certbot registration directory
    stat:
      path: /etc/letsencrypt/accounts/acme-v02.api.letsencrypt.org/directory
    register: certbot_registration

  - name: Certbot is registered
    debug:
      msg: "Certbot is registered!"
    when: certbot_certificate_directory.stat is defined and certbot_registration.stat.exists

  - name: Run certbot registration
    shell: "certbot register --email {{ lookup('env', 'CERTBOTEMAIL') }} --agree-tos --no-eff-email"
    register: certbot_registration_result
    when: certbot_certificate_directory.stat is defined and not certbot_registration.stat.exists

  - name: Debug certbot registration result
    debug:
      msg: "{{ certbot_registration_result.stdout }}"
    when: certbot_certificate_directory.stat is defined and not certbot_registration.stat.exists

  - name: Run certbot to obtain a certificate
    shell: "certbot certonly --standalone --non-interactive -d {{ lookup('env', 'CERTBOTDOMAIN') }}"
    register: certbot_certificate_result
    ignore_errors: no
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Debug certbot certificate result
    debug:
      msg: "{{ certbot_certificate_result.stdout }}"
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Check for success message in certbot certificate output
    assert:
      that:
        - "'Successfully received certificate.' in certbot_certificate_result.stdout"
      fail_msg: "Certbot did't get certificate for you domain!"
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_directory.stat.exists

  - name: Final check for certbot certificate directory
    stat:
      path: /etc/letsencrypt/live/{{ lookup('env', 'CERTBOTDOMAIN') }}
    register: certbot_certificate_final_check

  - name: Fail if certbot certificate directory does not exist
    fail:
      msg: "Certbot directory for domain {{ lookup('env', 'CERTBOTDOMAIN') }} does not exist. Please ensure Certbot is registered and the certificate has been obtained."
    when: certbot_certificate_directory.stat is defined and not certbot_certificate_final_check.stat.exists

  - name: Create Certbot CLI configuration file
    copy:
      dest: /etc/letsencrypt/cli.ini
      content: |
        authenticator = webroot
        webroot-path = /var/www/html
        post-hook = service nginx reload
        text = True
      owner: root
      group: root

  - name: Check if B2MPROTMP.license file exists
    stat:
      path: "{{ playbook_dir }}/B2MPROTMP.license"
    register: b2m_tmp_license_file

  - name: Request B2M temporary license
    uri:
      url: https://license.totum-online.ru/Remotes/b2mTmpLicense
      method: POST
      body_format: form-urlencoded
      body:
        EMAIL: "{{ lookup('env', 'CERTBOTEMAIL') }}"
        DOMAIN: "{{ lookup('env', 'CERTBOTDOMAIN') }}"
      return_content: yes
    register: b2m_tmp_license_response
    when: not b2m_tmp_license_file.stat.exists

  - name: Save B2M temporary license to B2MPROTMP.license
    copy:
      dest: "{{ playbook_dir }}/B2MPROTMP.license"
      content: "{{ b2m_tmp_license_response.content }}"
    when: not b2m_tmp_license_file.stat.exists and not (b2m_tmp_license_response.content | trim).startswith('Error:')

  - name: Fail if B2M temporary license request returned error
    fail:
      msg: "{{ b2m_tmp_license_response.content }}"
    when: not b2m_tmp_license_file.stat.exists and (b2m_tmp_license_response.content | trim).startswith('Error:')

  # Create a user

  - name: Create group totum
    group:
      name: totum
      state: present

  - name: Add user totum
    user:
      name: totum
      group: totum
      shell: /bin/bash
      state: present
      create_home: yes

  - name: Set permissions for the home directory of user totum
    file:
      path: /home/totum
      state: directory
      mode: '0755'

  # Install PHP and modules

  - name: apt install PHP 8.5 and modules
    apt:
      name:
        - php8.5
        - php8.5-bcmath
        - php8.5-cli
        - php8.5-curl
        - php8.5-fpm
        - php8.5-gd
        - php8.5-mbstring
        - php8.5-pgsql
        - php8.5-xml
        - php8.5-zip
        - php8.5-soap
        - php8.5-ldap
        - php8.5-tidy
      state: latest

  - name: apt install libfcgi-bin
    apt:
      name: libfcgi-bin
      state: latest

  - name: Check if totum_fpm.conf file exists
    stat:
      path: /etc/php/8.5/fpm/pool.d/totum.conf
    register: totum_fpm_conf

  - name: Download totum_fpm.conf
    get_url:
      url: https://raw.githubusercontent.com/totumonline/totum-b2m-ru/b2m/totum/moduls/install/totum_pool.conf
      dest: /etc/php/8.5/fpm/pool.d/totum.conf
      owner: root
      group: root
    when: not totum_fpm_conf.stat.exists

  - name: Create sessions_totum directory
    file:
      path: /var/lib/php/sessions_totum
      state: directory
      owner: root
      group: root
      mode: '1733'

  - name: Remove default www.conf
    file:
      path: /etc/php/8.5/fpm/pool.d/www.conf
      state: absent

  - name: Restart PHP FPM service
    service:
      name: php8.5-fpm
      state: restarted

  # Install Nginx

  - name: apt install nginx and brotli modules
    apt:
      name:
        - nginx
        - libnginx-mod-http-brotli-filter
        - libnginx-mod-http-brotli-static
      state: latest

  - name: Check if totum.online.conf file exists
    stat:
      path: /etc/nginx/sites-available/totum.online.conf
    register: totum_online_conf

  - name: Create directory for acme-challenge
    file:
      path: /var/www/html/.well-known/acme-challenge
      state: directory
      owner: root
      group: root

  - name: Remove default Nginx site configuration (available)
    file:
      path: /etc/nginx/sites-available/default
      state: absent

  - name: Remove default Nginx site configuration (enabled)
    file:
      path: /etc/nginx/sites-enabled/default
      state: absent

  - name: Create Nginx acme configuration file
    copy:
      dest: /etc/nginx/acme
      content: |
        location /.well-known {
            root /var/www/html;
        }

  # Actions for domain install

  - name: Download totum.online.conf
    get_url:
      url: https://raw.githubusercontent.com/totumonline/totum-b2m-ru/b2m/totum/moduls/install/totum.online.b2m.conf
      dest: /etc/nginx/sites-available/totum.online.conf
      owner: root
      group: root
    when: not totum_online_conf.stat.exists

  - name: Replace domain in totum.online.conf
    replace:
      path: /etc/nginx/sites-available/totum.online.conf
      regexp: 'YOUR_DOMAIN'
      replace: "{{ lookup('env', 'CERTBOTDOMAIN') }}"

  # Restart nginx

  - name: Create symlink for Totum Nginx configuration
    file:
      src: /etc/nginx/sites-available/totum.online.conf
      dest: /etc/nginx/sites-enabled/totum.online.conf
      state: link

  - name: Restart Nginx service
    service:
      name: nginx
      state: restarted

  # Install PostgreSQL

  - name: apt install postgresql
    apt:
      name: postgresql-18
      state: present

  - name: apt install postgresql-contrib
    apt:
      name: postgresql-contrib-18
      state: present

  - name: apt install python3-psycopg2
    apt:
      name: python3-psycopg2
      state: present

  - name: Create PostgreSQL user
    become_user: postgres
    postgresql_user:
      name: "totum"
      password: "{{ lookup('env', 'TOTUMBASEPASS') }}"
      encrypted: yes
      state: present

  - name: Create PostgreSQL database
    become_user: postgres
    postgresql_db:
      name: "totum"
      owner: "totum"
      state: present

  - name: Grant all privileges on database totum to user totum
    become_user: postgres
    postgresql_privs:
      login_db: "totum"
      role: "totum"
      privs: ALL
      type: database
      state: present

  - name: Create pg_trgm extension in totum database
    become_user: postgres
    postgresql_ext:
      login_db: "totum"
      name: pg_trgm
      schema: public
      state: present

  - name: Grant USAGE on schema public to totum
    become_user: postgres
    postgresql_privs:
      login_db: "totum"
      role: "totum"
      type: schema
      objs: public
      privs: USAGE
      state: present

  - name: Set search_path for totum role
    become_user: postgres
    shell: psql -c 'ALTER ROLE totum SET search_path = "$user", public;'

  # Install Totum

  - name: Check if totum-pro directory exists
    stat:
      path: /home/totum/totum-pro
    register: totum_pro

  - name: Clone Totum B2M RU GitHub repository
    git:
      repo: https://github.com/totumonline/totum-b2m-ru.git
      dest: /home/totum/totum-pro
      version: b2m
      update: yes
    become_user: totum
    when: not totum_pro.stat.exists

  - name: Check if composer.phar file exists
    stat:
      path: /home/totum/totum-pro/composer.phar
    register: composer_phar

  - name: Download Composer installer
    get_url:
      url: https://getcomposer.org/installer
      dest: /home/totum/totum-pro/composer-setup.php
      owner: totum
      group: totum
    when: not composer_phar.stat.exists

  - name: Unpack Composer installer
    shell: php /home/totum/totum-pro/composer-setup.php --quiet
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    when: not composer_phar.stat.exists

  - name: Remove Composer installer
    file:
      path: /home/totum/totum-pro/composer-setup.php
      state: absent

  - name: Run Composer install
    shell: php /home/totum/totum-pro/composer.phar install --no-dev
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash

  - name: Check if CLI.totum.php.ini file exists
    stat:
      path: /home/totum/totum-pro/CLI.totum.php.ini
    register: cli_totum_php_ini

  - name: Create CLI.totum.php.ini file
    copy:
      dest: /home/totum/totum-pro/CLI.totum.php.ini
      content: |
        opcache.enable_cli = 1
        opcache.memory_consumption = 256M
        date.timezone = Europe/London
      owner: totum
      group: totum
      mode: '0664'
    when: not cli_totum_php_ini.stat.exists

  - name: Replace timezone in CLI.totum.php.ini
    replace:
      path: /home/totum/totum-pro/CLI.totum.php.ini
      regexp: 'Europe/London'
      replace: "{{ lookup('env', 'TOTUMTIMEZONE') }}"

  - name: Check if FPM.totum.php.ini file exists
    stat:
      path: /home/totum/totum-pro/FPM.totum.php.ini
    register: fpm_totum_php_ini

  - name: Create FPM.totum.php.ini file
    copy:
      dest: /home/totum/totum-pro/FPM.totum.php.ini
      content: |
        memory_limit = 512M
        upload_max_filesize = 100M
        post_max_size = 0
        opcache.enable = 1
        opcache.memory_consumption = 256M
        opcache.jit = tracing
        opcache.jit_buffer_size = 64M
        date.timezone = Europe/London
        session.save_path = /var/lib/php/sessions_totum
        display_errors = stderr
        log_errors = On
      owner: totum
      group: totum
      mode: '0664'
    when: not fpm_totum_php_ini.stat.exists

  - name: Replace timezone in FPM.totum.php.ini
    replace:
      path: /home/totum/totum-pro/FPM.totum.php.ini
      regexp: 'Europe/London'
      replace: "{{ lookup('env', 'TOTUMTIMEZONE') }}"

  - name: Create symlink for Totum PHP-FPM INI configuration
    file:
      src: /home/totum/totum-pro/FPM.totum.php.ini
      dest: /etc/php/8.5/fpm/conf.d/90-FPM.totum.php.ini
      state: link

  - name: Restart PHP FPM service
    service:
      name: php8.5-fpm
      state: restarted

  # Install Totum Online

  - name: Check if Conf.php file exists
    stat:
      path: /home/totum/totum-pro/Conf.php
    register: conf_php

  - name: Set install_url
    set_fact:
      install_url: "{{ lookup('env', 'CERTBOTDOMAIN') }}"

  - name: Show install_url variable
    debug:
      msg: "The install_url is: {{ install_url }}"

  - name: Install totum via bin/totum install tool
    shell: bin/totum install --pgdump=pg_dump --psql=psql -e -- {{ lookup('env', 'TOTUMLANG') }} totum {{ lookup('env', 'CERTBOTEMAIL') }} {{ install_url }} admin {{ lookup('env', 'TOTUMADMINPASS') }} totum localhost totum {{ lookup('env', 'TOTUMBASEPASS') }}
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    when: not conf_php.stat.exists
    register: totum_install_output

  - name: Display totum install output
    debug:
      msg: "{{ totum_install_output.stdout }}"
    when: not conf_php.stat.exists

  - name: Copy B2MPROTMP.license to PRO.license
    copy:
      src: "{{ playbook_dir }}/B2MPROTMP.license"
      dest: /home/totum/totum-pro/PRO.license
      remote_src: yes
      owner: totum
      group: totum
      force: no

  - name: Set pg_trgm.word_similarity_threshold for totum database
    become_user: postgres
    shell: psql -c "ALTER DATABASE totum SET pg_trgm.word_similarity_threshold = 0.55;"

  - name: Check if Crypto.key file exists
    stat:
      path: /home/totum/totum-pro/Crypto.key
    register: crypto_key

  - name: Generate Crypto.key
    shell: openssl rand -base64 64 > /home/totum/totum-pro/Crypto.key
    become_user: totum
    args:
      executable: /bin/bash
    when: not crypto_key.stat.exists

  - name: Update secure setting in Conf.php
    replace:
      path: /home/totum/totum-pro/Conf.php
      regexp: "\\/\\*'secure' => true,\\*\\/"
      replace: "'secure' => true,"

  # Add totum-gom service

  - name: Create symlink for Totum service configuration
    file:
      src: /home/totum/totum-pro/totum-gom.service
      dest: /etc/systemd/system/totum-gom.service
      state: link

  - name: Reload systemd manager configuration
    systemd:
      daemon_reload: yes

  - name: Enable totum-gom service
    systemd:
      name: totum-gom
      enabled: yes

  - name: Start totum-gom service
    systemd:
      name: totum-gom
      state: started

  - name: Check totum-gom service status
    systemd:
      name: totum-gom
      state: started
      enabled: yes

  - name: Add sudoers entry for totum-gom restart
    lineinfile:
      path: /etc/sudoers.d/restart-totum-gom
      line: 'totum ALL=(ALL) NOPASSWD: /usr/sbin/service totum-gom restart'
      create: yes
      mode: '0440'

  - name: Add sudoers entry for totum-gom start
    lineinfile:
      path: /etc/sudoers.d/restart-totum-gom
      line: 'totum ALL=(ALL) NOPASSWD: /usr/sbin/service totum-gom start'
      create: yes
      mode: '0440'

  - name: Add sudoers entry for totum-gom stop
    lineinfile:
      path: /etc/sudoers.d/restart-totum-gom
      line: 'totum ALL=(ALL) NOPASSWD: /usr/sbin/service totum-gom stop'
      create: yes
      mode: '0440'

  - name: Add sudoers entry for totum-gom status
    lineinfile:
      path: /etc/sudoers.d/restart-totum-gom
      line: 'totum ALL=(ALL) NOPASSWD: /usr/sbin/service totum-gom status'
      create: yes
      mode: '0440'

  # Install B2M start database

  - name: Check B2MINSTALLED environment variable
    set_fact:
      b2m_installed: "{{ lookup('env', 'B2MINSTALLED') }}"

  - name: Install B2M start database via bin/totum schema-replace
    shell: bin/totum schema-replace --force --with-active-crons /home/totum/totum-pro/totum/moduls/install/b2m_start.sql.gz totum
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    register: b2m_start_output
    failed_when: b2m_start_output.rc != 0 or 'Sql data loaded' not in b2m_start_output.stdout or 'We found some errors in process' in b2m_start_output.stdout
    when: b2m_installed == ""

  - name: Display B2M start database install output
    debug:
      msg: "{{ b2m_start_output.stdout }}"
    when: b2m_installed == ""

  - name: Set admin password in B2M start database
    shell: bin/totum schema-passwd --schema=totum admin {{ lookup('env', 'TOTUMADMINPASS') | quote }}
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    register: b2m_passwd_output
    until: b2m_passwd_output.rc == 0
    retries: 5
    delay: 3
    when: b2m_installed == ""

  - name: Generate crypt_solt in B2M start database settings
    shell: bin/totum exec --schema=totum 1 eyJjb2RlIjoiPTogc2V0KHRhYmxlOiAnc2V0dGluZ3MnOyBmaWVsZDogJ2NyeXB0X3NvbHQnID0gJGNyeXB0X3NvbHQpXG5cblx0Y3J5cHRfc29sdDogc3RyUmFuZG9tKGxlbmd0aDogODsgbnVtYmVyczogXCJ0cnVlXCI7IGxldHRlcnM6IFwidHJ1ZVwiOyBzeW1ib2xzOiBcImZhbHNlXCIpIiwidmFycyI6W119
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    when: b2m_installed == ""

  - name: Update B2M schema via bin/totum schema-update
    shell: bin/totum schema-update b2m /home/totum/totum-pro/totum/moduls/install/b2m.json.gz.ttm --schema="totum"
    become_user: totum
    args:
      chdir: /home/totum/totum-pro
      executable: /bin/bash
    when: b2m_installed == ""

  - name: Append B2MINSTALLED to totum_install_vars
    lineinfile:
      path: "{{ playbook_dir }}/totum_install_vars"
      line: "export B2MINSTALLED=true"
    when: b2m_installed == ""

  # Download B2M demo files

  - name: Check DEMOFILES environment variable
    set_fact:
      demo_files: "{{ lookup('env', 'DEMOFILES') }}"

  - name: Start B2M demo files archive download in background (with resume)
    shell: wget -c --progress=dot:mega -o /home/totum/b2m_demo_files.log -O /home/totum/b2m_demo_files.tar.gz https://totum.totum.online/fls/b2m_demo_files.tar.gz; echo "EXIT:$?" >> /home/totum/b2m_demo_files.log
    become_user: totum
    args:
      chdir: /home/totum
      executable: /bin/bash
    async: 7200
    poll: 0
    when: demo_files == ""

  - name: Show B2M demo files download progress
    debug:
      msg: "{{ lookup('pipe', 'sleep 5; grep \"%\" /home/totum/b2m_demo_files.log 2>/dev/null | tail -n 1 || true') | default('Waiting for download to start...', true) }}"
    loop: "{{ range(0, 1440) | list if demo_files == '' else [] }}"
    loop_control:
      label: "{{ (item + 1) * 5 }}s"
      break_when:
        - lookup('pipe', 'tail -n 1 /home/totum/b2m_demo_files.log 2>/dev/null || true') is match('EXIT:')

  - name: Check B2M demo files download result
    shell: tail -n 1 /home/totum/b2m_demo_files.log
    register: demo_files_download_result
    changed_when: false
    failed_when: demo_files_download_result.stdout | trim != 'EXIT:0'
    when: demo_files == ""

  - name: Create demo files directory for domain
    file:
      path: "/home/totum/totum-pro/http/fls/{{ install_url }}"
      state: directory
      owner: totum
      group: totum
      mode: '0755'
    when: demo_files == ""

  - name: Start B2M demo files archive unpacking in background
    shell: set -o pipefail; LC_ALL=C dd if=/home/totum/b2m_demo_files.tar.gz bs=4M status=progress 2>/home/totum/b2m_demo_unpack.log | tar -xzf - -C "/home/totum/totum-pro/http/fls/{{ install_url }}"; echo "EXIT:$?" >> /home/totum/b2m_demo_unpack.log
    become_user: totum
    args:
      chdir: /home/totum
      executable: /bin/bash
    async: 7200
    poll: 0
    when: demo_files == ""

  - name: Show B2M demo files unpacking progress
    debug:
      msg: >-
        {{ lookup('pipe', "sleep 5; tr '\\r' '\\n' < /home/totum/b2m_demo_unpack.log 2>/dev/null | awk -v s=$(stat -c %s /home/totum/b2m_demo_files.tar.gz) '/bytes/ {b=$1} END {if (b) printf \"%d%% (%d / %d MB)\", b*100/s, b/1048576, s/1048576}' || true") | default('Waiting for unpacking to start...', true) }}
    loop: "{{ range(0, 1440) | list if demo_files == '' else [] }}"
    loop_control:
      label: "{{ (item + 1) * 5 }}s"
      break_when:
        - lookup('pipe', 'tail -n 1 /home/totum/b2m_demo_unpack.log 2>/dev/null || true') is match('EXIT:')

  - name: Check B2M demo files unpacking result
    shell: tail -n 1 /home/totum/b2m_demo_unpack.log
    register: demo_files_unpack_result
    changed_when: false
    failed_when: demo_files_unpack_result.stdout | trim != 'EXIT:0'
    when: demo_files == ""

  - name: Remove B2M demo files archive, download and unpacking logs
    file:
      path: "{{ item }}"
      state: absent
    loop:
      - /home/totum/b2m_demo_files.tar.gz
      - /home/totum/b2m_demo_files.log
      - /home/totum/b2m_demo_unpack.log
    when: demo_files == ""

  - name: Append DEMOFILES to totum_install_vars
    lineinfile:
      path: "{{ playbook_dir }}/totum_install_vars"
      line: "export DEMOFILES=true"
    when: demo_files == ""

  # Download B2M html files

  - name: Check HTMLFILES environment variable
    set_fact:
      html_files: "{{ lookup('env', 'HTMLFILES') }}"

  - name: Download B2M html files archive
    get_url:
      url: https://totum.totum.online/fls/b2m_html_files.tar.gz
      dest: /home/totum/b2m_html_files.tar.gz
      owner: totum
      group: totum
    when: html_files == ""

  - name: Unpack B2M html files archive
    unarchive:
      src: /home/totum/b2m_html_files.tar.gz
      dest: /home/totum/totum-pro
      remote_src: yes
      owner: totum
      group: totum
    when: html_files == ""

  - name: Remove B2M html files archive
    file:
      path: /home/totum/b2m_html_files.tar.gz
      state: absent
    when: html_files == ""

  - name: Append HTMLFILES to totum_install_vars
    lineinfile:
      path: "{{ playbook_dir }}/totum_install_vars"
      line: "export HTMLFILES=true"
    when: html_files == ""

  # Download B2M seo files

  - name: Check SEOFILES environment variable
    set_fact:
      seo_files: "{{ lookup('env', 'SEOFILES') }}"

  - name: Download B2M seo files archive
    get_url:
      url: https://totum.totum.online/fls/b2m_seo_files.tar.gz
      dest: /home/totum/b2m_seo_files.tar.gz
      owner: totum
      group: totum
    when: seo_files == ""

  - name: Create seo-files directory for domain
    file:
      path: "/home/totum/totum-pro/http/seo/{{ install_url }}"
      state: directory
      owner: totum
      group: totum
      mode: '0755'
    when: seo_files == ""

  - name: Unpack B2M seo files archive
    unarchive:
      src: /home/totum/b2m_seo_files.tar.gz
      dest: "/home/totum/totum-pro/http/seo/{{ install_url }}"
      remote_src: yes
      owner: totum
      group: totum
    when: seo_files == ""

  - name: Replace host placeholder in B2M seo files
    replace:
      path: "/home/totum/totum-pro/http/seo/{{ install_url }}/{{ item }}"
      regexp: '\{host\}'
      replace: "{{ install_url }}"
    loop:
      - robots.txt
      - sitemap.xml
    when: seo_files == ""

  - name: Remove B2M seo files archive
    file:
      path: /home/totum/b2m_seo_files.tar.gz
      state: absent
    when: seo_files == ""

  - name: Append SEOFILES to totum_install_vars
    lineinfile:
      path: "{{ playbook_dir }}/totum_install_vars"
      line: "export SEOFILES=true"
    when: seo_files == ""

  # Add Crons

  - name: Initialize empty crontab for root if missing
    shell: crontab -u root -l >/dev/null 2>&1 || echo '' | crontab -u root -
    become: true

  - name: Initialize empty crontab for totum if missing
    shell: crontab -u totum -l >/dev/null 2>&1 || echo '' | crontab -u totum -
    become: true

  - name: Generate a random minute for cron job
    set_fact:
      random_minute: "{{ 1 + (59 | random) }}"

  - name: Add cron job for certbot renew with random minute
    cron:
      name: "certbot-renew"
      minute: "{{ random_minute }}"
      hour: "*/12"
      day: "*"
      month: "*"
      weekday: "*"
      user: "root"
      job: "certbot renew --quiet --allow-subset-of-names"

  - name: Add cron job for cleaning sessions_totum
    cron:
      name: "clean sessions_totum"
      minute: "*/20"
      hour: "*"
      day: "*"
      month: "*"
      weekday: "*"
      user: "root"
      job: "find /var/lib/php/sessions_totum -type f -name 'sess_*' -mmin +1440 -delete"

  - name: Add cron job for totum schemas-crons
    cron:
      name: "bin/totum schemas-crons"
      minute: "*"
      hour: "*"
      day: "*"
      month: "*"
      weekday: "*"
      user: "totum"
      job: "cd /home/totum/totum-pro/ && bin/totum schemas-crons"

  - name: Add cron job for totum clean-tmp-dir
    cron:
      name: "bin/totum clean-tmp-dir"
      minute: "*/10"
      hour: "*"
      day: "*"
      month: "*"
      weekday: "*"
      user: "totum"
      job: "cd /home/totum/totum-pro/ && bin/totum clean-tmp-dir"

  - name: Add cron job for totum clean-schemas-tmp-tables
    cron:
      name: "bin/totum clean-schemas-tmp-tables"
      minute: "*/10"
      hour: "*"
      day: "*"
      month: "*"
      weekday: "*"
      user: "totum"
      job: "cd /home/totum/totum-pro/ && bin/totum clean-schemas-tmp-tables"

  - name: Add cron job for totum clean-tmp-tables-files-multi
    cron:
      name: "bin/totum clean-tmp-tables-files-multi"
      minute: "0"
      hour: "*/3"
      day: "*"
      month: "*"
      weekday: "*"
      user: "totum"
      job: "cd /home/totum/totum-pro/ && bin/totum clean-tmp-tables-files-multi"

  - name: Add cron job for totum switch-off-extra-notifications
    cron:
      name: "bin/totum switch-off-extra-notifications"
      minute: "20"
      hour: "3"
      day: "*"
      month: "*"
      weekday: "*"
      user: "totum"
      job: "cd /home/totum/totum-pro/ && bin/totum switch-off-extra-notifications 50"

  # Set execSSH for PRO

  - name: Activating execSSH in Conf.php
    replace:
      path: /home/totum/totum-pro/Conf.php
      regexp: "'inner'"
      replace: "true"

  - name: Activating interfaces in Conf.php
    replace:
      path: /home/totum/totum-pro/Conf.php
      regexp: '//protected \$interfacesSwitchedOn = true;'
      replace: 'protected $interfacesSwitchedOn = true;'

  # Final

  - name: Show installation completion message
    debug:
      msg: "NOW YOU CAN OPEN YOUR BROWSER AT https://{{ install_url }}/totum AND LOGIN AS admin AND {{ lookup('env', 'TOTUMADMINPASS') }}"

  - name: Ask to upgrade software on the server
    pause:
      prompt: "Do you want to upgrade the software on the server? If yes, type (A) or (N)"
    register: upgrade_response

  - name: Perform apt upgrade if user agreed
    apt:
      upgrade: safe
    when: upgrade_response.user_input | lower == 'a'