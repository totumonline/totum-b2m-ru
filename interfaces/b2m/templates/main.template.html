<!--##########
main
##########-->

<main class="main-page" style="--poster-none: none;">
  {__list_main_page_elements}
</main>

<!--##########
__list_main_page_elements
##########-->

<!-- __hits __latest __discounts в этом шаблоне, также используются готовые элементы banner / gallery / collection-full и шаблон collection-group.template.html -->

<!--##########
__hits
##########-->

<section class="main-page--stripes" id="hits">
  <div class="main-page--stripes--title--block">
    <h2>{hits_title}</h2>
    <a href="{hits_url}">/ {hits_link_text}</a>
  </div>
  {__hits_scrollable_line}
</section>

<!--##########
__hits_scrollable_line
##########-->

<!-- используется шаблон scrollable-line.template.html -->
