<!--##########
main
##########-->

<div class="---search-content--products">
  <div class="---search-content--products--title">Найденные товары</div>
  <div class="---search-content--products--list">
    <ul>
      {__list_search_products}
    </ul>
  </div>
</div>

<!--##########
__list_search_products
##########-->

<li class="search-product-item">
  <a href="{product_url}">
    <div class="search-product-item--image {cover}">
      <img src="{product_image}" alt="{product_alt}">
    </div>
    <div class="search-product-item--block">
      <div class="search-product-item--block--name">{product_name}</div>
      <div class="search-product-item--block--bottom">
        <div class="search-product-item--block--bottom--price {product_from}">{product_price}</div>
        <div class="search-product-item--block--bottom--article">{product_sku}</div>
      </div>
    </div>
  </a>
</li>

<!--##########
__nothing_found
##########-->

<div class="search--nothing-found">
	<span>Упс! Похоже, что ничего не нашлось...</span> <i class="fa-solid fa-filter-circle-xmark"></i>
</div>

<!--##########
__categories
##########-->

<div class="---search-content--categories __active">
  <div class="---search-content--categories--title">Найденные категории</div>
  <div class="---search-content--categories--list">
    <ul>
      {__list_categories}
    </ul>
  </div>
</div>

<!--##########
__list_categories
##########-->

<li><a href="{category_url}">{category_name}</a></li>
