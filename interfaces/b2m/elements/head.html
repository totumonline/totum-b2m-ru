  {link_rel}

  {noindex}

  {page_image_preload}

  {configurator_script}

  <script>
    window.interface = '{interface}';
  </script>

  <script>
    (function() {
      function setAllHeaderHeight() {
        var headerMain = document.querySelector('.header--main');
        if (!headerMain) return false;
        var height = headerMain.offsetHeight;
        if (window.innerWidth >= 1121) {
          var topMenuNav = document.getElementById('top-menu');
          var quickNav = document.getElementById('quick');
          height += topMenuNav ? topMenuNav.offsetHeight : 0;
          height += quickNav ? quickNav.offsetHeight : 0;
        }
        document.body.style.setProperty('--all-header-height', height + 'px');
        return true;
      }

      var cachedHeader = null;
      var headerObserver = new MutationObserver(function() {
        if (!document.body) return;
        if (!cachedHeader) cachedHeader = document.querySelector('header');
        if (!cachedHeader || !cachedHeader.nextElementSibling) return;
        headerObserver.disconnect();
        setAllHeaderHeight();
      });
      headerObserver.observe(document.documentElement, { childList: true, subtree: true });

      document.addEventListener('DOMContentLoaded', function() {
        headerObserver.disconnect();
        setAllHeaderHeight();
      });
    })();
  </script>
